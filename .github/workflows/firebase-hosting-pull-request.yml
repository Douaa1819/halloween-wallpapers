# Checks every pull request, and for pull requests from this repo (not forks) deploys a temporary
# preview and comments its link on the pull request.
name: Check and preview

on: pull_request

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment the preview link
      checks: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fails the pull request with a list of problems if catalog.json or an image is wrong.
      - run: npm run build

      # Forks don't get repository secrets, so their pull requests are checked but not previewed.
      - if: github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MD_CH_ECF99 }}
          projectId: md-ch-ecf99
          expires: 7d
